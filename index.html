<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainer">
<meta name="theme-color" content="#1F3864">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Prüfungstrainer</title>
<style>
  :root{
    --accent:#1F3864; --accent-mid:#2d4f8a; --accent-light:#D9E2F3; --grey:#F2F2F2;
    --ok:#2e7d32; --warn:#e09b00; --bad:#c62828; --na:#757575;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#eef1f6; color:#1a1a1a; font-size:16px; min-height:100%;}
  header{position:sticky; top:0; z-index:10; background:var(--accent); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; box-shadow:0 2px 6px rgba(0,0,0,.2);}
  header h1{font-size:17px; margin:0; flex:1; font-weight:600; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  header .hsub{font-size:13px; font-weight:600; background:rgba(255,255,255,.15); padding:5px 10px; border-radius:9px; flex-shrink:0;}
  header .hsub.timer-low{background:var(--bad); animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.6;}}
  header button{background:rgba(255,255,255,.15); border:none; color:#fff; font-size:17px; padding:8px 13px; border-radius:9px; flex-shrink:0;}
  main{padding:14px; max-width:640px; margin:0 auto; padding-bottom:calc(120px + env(safe-area-inset-bottom));}
  .card{background:#fff; border-radius:var(--radius); box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; overflow:hidden;}
  .card .body{padding:16px;}
  .card h2{font-size:15px; margin:0 0 10px; color:var(--accent);}
  .empty{text-align:center; color:#888; padding:36px 20px; font-size:15px;}
  .hint{font-size:12.5px; color:#888; text-align:center; margin:10px 0; line-height:1.45;}
  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:30; max-width:86%; text-align:center;}
  .toast.show{opacity:1;}
  .fab{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:center; gap:10px; padding:0 16px; z-index:9; max-width:640px; margin:0 auto;}
  .fab button{flex:1; padding:16px 8px; font-size:16px; font-weight:700; border:none; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.25);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-green{background:var(--ok); color:#fff;}
  .btn-plain{background:#fff; color:var(--accent);}

  /* Dashboard */
  .ringwrap{display:flex; align-items:center; gap:18px;}
  .ring{width:110px; height:110px; flex-shrink:0;}
  .ring .pct{font-size:22px; font-weight:800; fill:var(--accent);}
  .ring .pctlbl{font-size:9.5px; fill:#889; font-weight:600;}
  .ringinfo{flex:1; font-size:14px; color:#445; line-height:1.55;}
  .ringinfo b{color:var(--accent);}
  .boxbar{display:flex; gap:5px; margin-top:12px;}
  .boxbar .bx{flex:1; text-align:center; border-radius:9px; padding:7px 2px; font-size:11px; font-weight:600; color:#667; background:var(--grey);}
  .boxbar .bx b{display:block; font-size:16px; color:#334;}
  .boxbar .bx.hot{background:#fdecea; color:#a33;}
  .boxbar .bx.hot b{color:var(--bad);}
  .boxbar .bx.good{background:#e8f3e9; color:#38663b;}
  .boxbar .bx.good b{color:var(--ok);}
  .pace{display:flex; align-items:center; gap:12px; background:var(--accent-light); border-radius:10px; padding:12px; margin-top:12px;}
  .pace .num{font-size:26px; font-weight:800; color:var(--accent); flex-shrink:0;}
  .pace .txt{font-size:13.5px; color:#334; line-height:1.4;}
  .planbar{height:9px; border-radius:5px; background:#dde4f0; margin-top:10px; position:relative; overflow:hidden;}
  .planbar .fill{position:absolute; left:0; top:0; bottom:0; background:var(--ok); border-radius:5px;}
  .planbar .mark{position:absolute; top:-2px; bottom:-2px; width:2.5px; background:var(--accent);}
  .examhist .row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid #eee; font-size:14px;}
  .examhist .row:first-of-type{border-top:none;}
  .examhist .datum{color:#778; flex:1;}
  .examhist .res{font-weight:700;}
  .examhist .res.ok{color:var(--ok);}
  .examhist .res.bad{color:var(--bad);}
  .menu{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .menu button{padding:18px 10px; font-size:15.5px; font-weight:700; border:none; border-radius:var(--radius); background:#fff; color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.08); line-height:1.3;}
  .menu button .ico{display:block; font-size:26px; margin-bottom:6px;}
  .menu button.wide{grid-column:1/3;}
  .menu button:disabled{opacity:.45;}

  /* Lernkarte */
  .qcard{min-height:44vh; display:flex; flex-direction:column;}
  .qcard .qhead{display:flex; align-items:center; gap:8px; padding:12px 16px; background:var(--accent-light); color:var(--accent); font-size:13px; font-weight:700;}
  .qcard .qhead .spacer{flex:1;}
  .qcard .qhead .boxchip{background:#fff; border-radius:9px; padding:2px 9px;}
  .qcard .qtext{padding:18px 16px; font-size:17px; line-height:1.55; white-space:pre-line; flex:1;}
  .qcard .atext{padding:16px; font-size:15.5px; line-height:1.55; white-space:pre-line; border-top:2px dashed var(--accent-light); background:#fafbfe; color:#223;}
  .qcard .alabel{font-size:12px; font-weight:800; color:var(--ok); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px;}
  .reveal{margin:0 16px 16px; padding:16px; font-size:16px; font-weight:700; border:none; border-radius:12px; background:var(--accent); color:#fff; width:calc(100% - 32px);}
  .rate{display:flex; gap:8px;}
  .rate button{flex:1; padding:15px 4px; font-size:14.5px; font-weight:700; border:none; border-radius:14px; color:#fff; box-shadow:0 3px 10px rgba(0,0,0,.22); line-height:1.25;}
  .rate .r0{background:var(--bad);}
  .rate .r1{background:var(--warn);}
  .rate .r2{background:var(--ok);}
  .rate button .sub{display:block; font-size:11px; font-weight:600; opacity:.85; margin-top:2px;}
  .sessionbar{height:7px; border-radius:4px; background:#dde4f0; margin-bottom:12px; overflow:hidden;}
  .sessionbar .fill{height:100%; background:var(--accent); border-radius:4px; transition:width .25s;}

  /* Multiple Choice */
  .opts{padding:6px 12px 14px; display:flex; flex-direction:column; gap:9px;}
  .opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; padding:12px; font-size:14px; line-height:1.45; border:2px solid #ccd3e0; background:#fff; border-radius:12px; color:#223; font-family:inherit;}
  .opt .lt{font-weight:800; color:var(--accent); flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--accent-light); display:flex; align-items:center; justify-content:center; font-size:13px;}
  .opt .ot{white-space:pre-line; word-break:break-word;}
  .opt.sel{border-color:var(--accent); background:var(--accent-light);}
  .opt.correct{border-color:var(--ok); background:#e8f3e9;}
  .opt.correct .lt{background:var(--ok); color:#fff;}
  .opt.wrong{border-color:var(--bad); background:#fdecea;}
  .opt.wrong .lt{background:var(--bad); color:#fff;}
  .opt:disabled{opacity:1;}

  /* Prüfung */
  .examnav{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
  .examnav button{min-width:40px; height:40px; border-radius:10px; border:1.5px solid #ccd3e0; background:#fff; font-size:13px; font-weight:700; color:#556; flex-shrink:0;}
  .examnav button.cur{border-color:var(--accent); background:var(--accent); color:#fff;}
  .examnav button.hasnote{border-color:var(--accent-mid); background:var(--accent-light); color:var(--accent);}
  textarea{width:100%; padding:12px; font-size:16px; border:1.5px solid #ccd3e0; border-radius:10px; background:#fff; min-height:110px; resize:vertical; font-family:inherit;}
  textarea:focus{outline:none; border-color:var(--accent);}
  .grade3{display:flex; gap:7px; margin-top:10px;}
  .grade3 button{flex:1; padding:12px 4px; font-size:13.5px; font-weight:700; border:1.5px solid #ccd3e0; background:#fff; border-radius:10px; color:#556;}
  .grade3 .g1.sel{background:var(--ok); border-color:var(--ok); color:#fff;}
  .grade3 .gh.sel{background:var(--warn); border-color:var(--warn); color:#fff;}
  .grade3 .g0.sel{background:var(--bad); border-color:var(--bad); color:#fff;}
  .resultbig{text-align:center; padding:26px 16px;}
  .resultbig .pct{font-size:46px; font-weight:800;}
  .resultbig .verdict{font-size:19px; font-weight:800; margin-top:4px;}
  .resultbig .verdict.ok{color:var(--ok);}
  .resultbig .verdict.bad{color:var(--bad);}
  .resultbig .sub{color:#778; font-size:13.5px; margin-top:8px;}
  .revitem{border-left:5px solid #ccd3e0;}
  .revitem.g1{border-left-color:var(--ok);}
  .revitem.gh{border-left-color:var(--warn);}
  .revitem.g0{border-left-color:var(--bad);}
  .revitem .qt{font-weight:600; font-size:14.5px; white-space:pre-line; line-height:1.45;}
  .revitem .at{font-size:14px; white-space:pre-line; line-height:1.5; color:#334; background:#fafbfe; border-radius:10px; padding:12px; margin-top:10px;}
  .revitem .nt{font-size:13.5px; color:#556; background:#fff8e6; border-radius:10px; padding:10px; margin-top:8px; white-space:pre-line;}
  .revitem .idtag{font-size:11.5px; font-weight:700; color:#889; margin-bottom:6px;}

  /* Formulare / Settings */
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; padding:12px 4px; font-size:14.5px; border:1.5px solid #ccd3e0; background:#fff; border-radius:10px; color:#445;}
  .seg button.sel{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  label.fl{display:block; font-size:13px; font-weight:600; color:#556; margin:14px 0 6px;}
  label.fl:first-child{margin-top:0;}
  input[type=date]{width:100%; padding:11px; font-size:16px; border:1.5px solid #ccd3e0; border-radius:10px; background:#fff; font-family:inherit;}
  .danger{color:var(--bad); background:none; border:1.5px solid var(--bad); border-radius:10px; padding:11px; font-size:14.5px; font-weight:600; width:100%;}
  details.card summary{list-style:none; cursor:pointer; padding:14px 16px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:8px; user-select:none; font-size:15px;}
  details.card summary::-webkit-details-marker{display:none;}
  details.card summary .chev{margin-left:auto; transition:transform .2s; color:#999;}
  details[open] summary .chev{transform:rotate(90deg);}
</style>
</head>

/* ================= Konstanten ================= */
const LS_KEY = 'gutachten_trainer_v1';
const BOX_INTERVALS = {1:0, 2:1, 3:3, 4:7, 5:14};   // Tage bis zur Wiedervorlage
const MASTER_BOX = 4;                                // ab dieser Box: "Langzeitgedächtnis"
const ZIEL_TAGE = 60;                                // Lernziel: 100 % in 2 Monaten
const MIN_NEU_PRO_TAG = 5;

/* ================= Speicher (localStorage mit Sandbox-Fallback) ================= */
const store = (function(){
  try{
    const t='__test__'; localStorage.setItem(t,t); localStorage.removeItem(t);
    return localStorage;
  }catch(e){
    const mem={};
    return { getItem:k=>(k in mem?mem[k]:null), setItem:(k,v)=>{mem[k]=String(v);}, removeItem:k=>{delete mem[k];}, _memory:true };
  }
})();

function defaultState(){
  const heute = todayStr();
  return {
    settings: { ziel:'P-S', stil:'mc', examCount:45, examMinutes:60, passPct:60,
                startDatum:heute, zielDatum:addDays(heute, ZIEL_TAGE) },
    cards: {},          // id -> {box, due, ok, fail, seen}
    exams: [],          // {datum, count, p, pMax, pct, passed}
    reviewsByDay: {},   // 'YYYY-MM-DD' -> Anzahl bewerteter Karten
    activeExam: null    // {qids, notes, grades, deadline, minutes, count}
  };
}
let state = loadState();
function loadState(){
  try{
    const raw = store.getItem(LS_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    s.settings = Object.assign(d.settings, s.settings||{});
    for(const k of ['cards','exams','reviewsByDay']) if(!s[k]) s[k]=d[k];
    if(!('activeExam' in s)) s.activeExam = null;
    return s;
  }catch(e){ return defaultState(); }
}
function save(){ try{ store.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ================= Helfer ================= */
const $  = s => document.querySelector(s);
const el = (tag, attrs={}, html='') => { const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); if(html!=='') e.innerHTML=html; return e; };
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2000); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso, n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return ''; const p=iso.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function daysBetween(a, b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function pool(){
  return state.settings.ziel==='P-B' ? DATA.filter(q=>q.k==='P-B') : DATA;
}
function card(id){
  if(!state.cards[id]) state.cards[id] = {box:0, due:null, ok:0, fail:0, seen:0};
  return state.cards[id];
}
function byId(id){ return DATA.find(q=>q.id===id); }

const OPT_MAXLEN = 260;   // einheitlich kürzen, damit die Länge nichts verrät
function optText(qid, full){
  const t = byId(qid).a.replace(/\s+/g,' ').trim();
  if(full) return byId(qid).a;
  return t.length > OPT_MAXLEN ? t.slice(0, OPT_MAXLEN).trimEnd()+' … (antippen zum Aufklappen)' : t;
}
const _tokCache = {};
function toks(qid){
  if(!_tokCache[qid]){
    const t = byId(qid).a.toLowerCase().match(/[a-zäöüß§][a-zäöüß§0-9-]{4,}/g) || [];
    _tokCache[qid] = new Set(t);
  }
  return _tokCache[qid];
}
function buildOptions(id){
  /* 3 Ablenker, möglichst schwer: thematische Nähe (ID-Abstand, der Katalog ist
     nach Themen gruppiert) + Wortüberlappung mit der richtigen Antwort +
     ähnliche Antwortlänge. Aus den 10 besten werden 3 zufällig gezogen. */
  const me = parseInt(id, 10), myLen = byId(id).a.length, myT = toks(id);
  const scored = pool().filter(q=>q.id!==id).map(q=>{
    let ov = 0;
    for(const w of toks(q.id)) if(myT.has(w)) ov++;
    const dist = Math.abs(parseInt(q.id,10)-me);
    const lenDiff = Math.abs(q.a.length-myLen);
    return {id:q.id, score: ov*3 - dist*0.15 - lenDiff*0.01};
  }).sort((a,b)=>b.score-a.score);
  const picks = shuffle(scored.slice(0, 10)).slice(0, 3).map(x=>x.id);
  return shuffle([id].concat(picks));
}
const OPT_LETTERS = ['A','B','C','D'];
let expandedOpt = null;   // aktuell aufgeklappte Antwortoption

/* ================= Statistik / Pacing ================= */
function stats(){
  const p = pool(), heute = todayStr();
  let neu=0, lernen=0, sicher=0, faellig=0;
  const boxCounts=[0,0,0,0,0,0];
  for(const q of p){
    const c = state.cards[q.id];
    const box = c ? c.box : 0;
    boxCounts[box]++;
    if(box===0) neu++;
    else if(box>=MASTER_BOX) sicher++;
    else lernen++;
    if(box>0 && box<5 && c.due && c.due<=heute) faellig++;
    else if(box===5 && c.due && c.due<=heute) faellig++;
  }
  const gesamt = p.length;
  const pct = gesamt ? Math.round(100*sicher/gesamt) : 0;
  const s = state.settings;
  const daysLeft = Math.max(1, daysBetween(heute, s.zielDatum));
  const remaining = gesamt - sicher;
  const perDay = Math.ceil(remaining / daysLeft);
  const span = Math.max(1, daysBetween(s.startDatum, s.zielDatum));
  const elapsed = Math.min(span, Math.max(0, daysBetween(s.startDatum, heute)));
  const planPct = Math.round(100*elapsed/span);
  return {gesamt, neu, lernen, sicher, faellig, pct, daysLeft, remaining, perDay, planPct, boxCounts};
}
function bumpReviewCount(){
  const h = todayStr();
  state.reviewsByDay[h] = (state.reviewsByDay[h]||0)+1;
}

/* ================= Leitner-Bewertung ================= */
function applyGrade(id, grade){   // grade: 0 = nicht gewusst, 1 = unsicher, 2 = gewusst
  const c = card(id), heute = todayStr();
  c.seen++;
  if(grade===0){ c.fail++; c.box = 1; c.due = heute; c.lapse = 3; }   // 3x richtig nötig
  else if(grade===1){ c.box = Math.max(1, c.box); c.due = addDays(heute, 1); }
  else {
    c.ok++;
    if(c.lapse && c.lapse > 1){                       // Fehler-Schuld abtragen, Box bleibt unten
      c.lapse--; c.box = 1; c.due = heute;
    } else {
      c.lapse = 0;
      c.box = Math.min(5, Math.max(1, c.box)+1); c.due = addDays(heute, BOX_INTERVALS[c.box]);
    }
  }
  bumpReviewCount();
  save();
}
function markWrong(id){   // nachträglich als falsch werten (auch bei richtiger Antwort)
  const c = card(id);
  c.fail++; c.box = 1; c.due = todayStr(); c.lapse = 3;
  save();
}
function requeueCurrent(id){
  /* Karte, die heute nochmal fällig ist, ein paar Positionen später wieder
     einreihen (nicht direkt als Nächstes) - mit frisch gemischten Optionen */
  if(learn.mode==='free') return;
  if(card(id).due > todayStr()) return;
  const pos = Math.min(learn.queue.length, learn.idx + 4 + Math.floor(Math.random()*3));
  learn.queue.splice(pos, 0, id);
}

/* ================= Lern-Modus ================= */
function buildQueue(mode){
  const heute = todayStr(), st = stats();
  if(mode==='free') return shuffle(pool().map(q=>q.id));
  const due=[], neu=[];
  for(const q of pool()){
    const c = state.cards[q.id];
    if(!c || c.box===0) neu.push(q.id);
    else if(c.due && c.due<=heute) due.push(q.id);
  }
  due.sort((a,b)=>card(a).box-card(b).box || card(b).fail-card(a).fail);
  const neuLimit = Math.max(st.perDay, MIN_NEU_PRO_TAG);
  return due.concat(shuffle(neu).slice(0, neuLimit));
}
function startLearn(mode){
  const queue = buildQueue(mode);
  if(!queue.length){
    toast('🎉 Nichts fällig – alles erledigt für heute!');
    return;
  }
  learn = {queue, idx:0, revealed:false, pick:null, opts:{}, mode, total:queue.length, done:{r0:0,r1:0,r2:0}};
  view='learn';
  renderLearnCard();
}
function renderLearnCard(){
  const main=$('#main'); main.innerHTML='';
  if(learn.idx >= learn.queue.length){ renderLearnDone(); return; }
  const id = learn.queue[learn.idx];
  const q = byId(id), c = card(id);
  setHeader(learn.mode==='free'?'Freies Lernen':'Lernen', (learn.idx+1)+' / '+learn.queue.length, confirmLeaveLearn);

  const sb = el('div',{class:'sessionbar'});
  sb.appendChild(el('div',{class:'fill',style:'width:'+Math.round(100*learn.idx/learn.queue.length)+'%'}));
  main.appendChild(sb);

  const qc = el('div',{class:'card qcard'});
  const qh = el('div',{class:'qhead'});
  qh.appendChild(el('span',{},'Frage '+q.id+' · '+q.k));
  qh.appendChild(el('span',{class:'spacer'}));
  qh.appendChild(el('span',{class:'boxchip'},c.box===0?'Neu':'Box '+c.box));
  qc.appendChild(qh);
  qc.appendChild(el('div',{class:'qtext'},esc(q.q)));

  const mc = state.settings.stil==='mc';
  const fab=$('#fab'); fab.innerHTML='';

  if(mc){
    /* ---------- Multiple Choice: antippen = auswählen + aufklappen,
       Auflösung erst nach "Antwort bestätigen" ---------- */
    if(!learn.opts[id]) learn.opts[id] = buildOptions(id);
    const opts = learn.opts[id];
    const box = el('div',{class:'opts'});
    opts.forEach((optId,i)=>{
      let cls = 'opt';
      if(learn.revealed){
        if(optId===id) cls += ' correct';
        else if(optId===learn.pick) cls += ' wrong';
      } else if(optId===learn.pick) cls += ' sel';
      const expanded = expandedOpt===optId || (learn.revealed && optId===id);
      const b = el('button',{class:cls});
      b.appendChild(el('span',{class:'lt'},OPT_LETTERS[i]));
      b.appendChild(el('span',{class:'ot'},esc(optText(optId, expanded))));
      if(!learn.revealed){
        b.onclick=()=>{
          learn.pick = optId;
          expandedOpt = optId;      // gewählte Antwort komplett lesbar machen
          renderLearnCard();
        };
      } else {
        b.onclick=()=>{ expandedOpt = (expandedOpt===optId ? null : optId); renderLearnCard(); };
      }
      box.appendChild(b);
    });
    qc.appendChild(box);
    if(learn.revealed){
      const at = el('div',{class:'atext'});
      at.appendChild(el('div',{class:'alabel'},learn.pick===id ? '✓ Richtig! Vollständige Antwort' : '✗ Leider falsch – richtige Antwort'));
      at.appendChild(el('div',{},esc(q.a)));
      qc.appendChild(at);
    }
    main.appendChild(qc);
    fab.className='fab';
    const advance = ()=>{
      // kommt die Karte später nochmal? Dann Optionen beim nächsten Mal neu mischen
      if(learn.queue.indexOf(id, learn.idx+1) > -1) delete learn.opts[id];
      learn.idx++; learn.revealed=false; learn.pick=null; expandedOpt=null;
      window.scrollTo(0,0); renderLearnCard(); };
    if(!learn.revealed){
      if(learn.pick!=null){
        const b = el('button',{class:'btn-green'},'Antwort bestätigen');
        b.onclick=()=>{
          learn.revealed = true;
          expandedOpt = null;
          const grade = learn.pick===id ? 2 : 0;
          applyGrade(id, grade);
          learn.done['r'+grade]++;
          requeueCurrent(id);       // falsch oder Fehler-Schuld: später nochmal
          renderLearnCard();
        };
        fab.appendChild(b);
      }
    } else {
      if(learn.pick===id){
        const bw = el('button',{class:'btn-plain',style:'color:var(--bad)'},'✗ Als falsch werten');
        bw.onclick=()=>{
          markWrong(id);
          learn.done.r2--; learn.done.r0++;
          requeueCurrent(id);
          toast('Kommt gleich nochmal – und muss 3× richtig sein.');
          advance();
        };
        fab.appendChild(bw);
      }
      const b = el('button',{class:'btn-primary'},'Weiter →');
      b.onclick=advance;
      fab.appendChild(b);
    }
  } else {
    /* ---------- Karteikarte ---------- */
    if(learn.revealed){
      const at = el('div',{class:'atext'});
      at.appendChild(el('div',{class:'alabel'},'Antwort'));
      at.appendChild(el('div',{},esc(q.a)));
      qc.appendChild(at);
    }
    main.appendChild(qc);
    if(!learn.revealed){
      fab.className='fab';
      const b = el('button',{class:'btn-primary'},'Antwort aufdecken');
      const doReveal = ()=>{ learn.revealed=true; renderLearnCard(); };
      b.onclick=doReveal;
      qc.style.cursor='pointer';
      qc.onclick=doReveal;
      fab.appendChild(b);
    } else {
      fab.className='fab rate';
      const mk=(cls,txt,sub,grade)=>{ const b=el('button',{class:cls},txt+'<span class="sub">'+sub+'</span>');
        b.onclick=()=>{ applyGrade(id,grade);
          learn.done['r'+grade]++;
          requeueCurrent(id);   // falsch oder Fehler-Schuld: ein paar Karten später nochmal
          learn.idx++; learn.revealed=false;
          window.scrollTo(0,0); renderLearnCard(); };
        return b; };
      fab.appendChild(mk('r0','✗ Nicht gewusst','kommt gleich wieder',0));
      fab.appendChild(mk('r1','≈ Unsicher','morgen erneut',1));
      fab.appendChild(mk('r2','✓ Gewusst','nächste Box',2));
    }
  }
}

      'Falsch beantwortete Fragen wandern automatisch in Box 1 des Lernsystems.'
    : 'Ablauf wie in der echten Prüfung: kein Feedback während der Prüfung. '+
      'Du kannst zu jeder Frage Stichpunkte notieren. Nach der Abgabe bewertest du dich selbst anhand der Musterantworten. '+
      'Bestanden ab '+state.settings.passPct+' % (in den Einstellungen änderbar). Falsch beantwortete Fragen wandern automatisch in Box 1 des Lernsystems.'));
  c.appendChild(b);
  main.appendChild(c);
  const fab=$('#fab'); fab.className='fab'; fab.innerHTML='';
  const bs = el('button',{class:'btn-primary'},'▶ Prüfung starten');
  bs.onclick=startExam;
  fab.appendChild(bs);
}
function startExam(){
  const n = Math.min(state.settings.examCount, pool().length);
  const qids = shuffle(pool().map(q=>q.id)).slice(0,n);
  const mc = state.settings.stil==='mc';
  const options = {};
  if(mc) for(const id of qids) options[id] = buildOptions(id);
  state.activeExam = { qids, notes:{}, grades:null, idx:0, mc, options, answers:{},
    minutes:state.settings.examMinutes, count:n,
    deadline: Date.now() + state.settings.examMinutes*60000 };
  save();
  renderExamQ();
}
function resumeExam(){
  const ex = state.activeExam;
  if(!ex) { renderExamSetup(); return; }
  if(ex.grades && !ex.mc) renderExamReview();
  else if(Date.now() > ex.deadline){ toast('Zeit war abgelaufen – weiter zur Auswertung'); ex.mc ? finishExamMC() : beginGrading(); }
  else renderExamQ();
}
function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function renderExamQ(){
  view='exam'; clearTimer();
  const ex = state.activeExam;
  const id = ex.qids[ex.idx], q = byId(id);
  setHeader('Prüfung · Frage '+(ex.idx+1)+' / '+ex.count, fmtClock(ex.deadline-Date.now()), ()=>{
    if(confirm('Prüfung wirklich abbrechen? Der Versuch wird verworfen.')){ state.activeExam=null; save(); clearTimer(); renderHome(); }
  });
  examTimerH = setInterval(()=>{
    const rest = ex.deadline - Date.now();
    const hs=$('#hSub'); if(!hs) return;
    hs.textContent = fmtClock(rest);
    if(rest < 5*60000) hs.classList.add('timer-low');
    if(rest <= 0){ clearTimer(); toast('⏰ Zeit abgelaufen!'); ex.mc ? finishExamMC() : beginGrading(); }
  }, 1000);

  const main=$('#main'); main.innerHTML='';
  const nav = el('div',{class:'examnav'});
  let curBtn = null;
  ex.qids.forEach((qid,i)=>{
    const answered = ex.mc ? (ex.answers[qid]!=null) : !!ex.notes[qid];
    const bt = el('button',{class: i===ex.idx?'cur':(answered?'hasnote':'')},String(i+1));
    bt.onclick=()=>{ ex.idx=i; save(); renderExamQ(); };
    if(i===ex.idx) curBtn=bt;
    nav.appendChild(bt);
  });
  main.appendChild(nav);
  if(curBtn) curBtn.scrollIntoView({inline:'center', block:'nearest'});

  const c = el('div',{class:'card qcard'});
  const qh = el('div',{class:'qhead'});
  qh.appendChild(el('span',{},'Frage '+q.id+' · '+q.k));
  c.appendChild(qh);
  c.appendChild(el('div',{class:'qtext'},esc(q.q)));
  if(ex.mc){
    if(renderExamQ._last !== id){ expandedOpt = null; renderExamQ._last = id; }
    const box = el('div',{class:'opts'});
    ex.options[id].forEach((optId,i)=>{
      const b = el('button',{class:'opt'+(ex.answers[id]===optId?' sel':'')});
      b.appendChild(el('span',{class:'lt'},OPT_LETTERS[i]));
      b.appendChild(el('span',{class:'ot'},esc(optText(optId, expandedOpt===optId))));
      b.onclick=()=>{
        if(ex.answers[id]===optId){ expandedOpt = (expandedOpt===optId ? null : optId); }
        else { ex.answers[id] = optId; expandedOpt = optId; save(); }
        renderExamQ();
      };
      box.appendChild(b);
    });
    c.appendChild(box);
  } else {
    c.appendChild(el('div',{class:'body',style:'padding-top:0'}));
    const ta = el('textarea',{placeholder:'Deine Stichpunkte (optional) …'});
    ta.value = ex.notes[id]||'';
    ta.oninput=()=>{ ex.notes[id]=ta.value; save(); };
    c.lastChild.appendChild(ta);
  }
  main.appendChild(c);

  const fab=$('#fab'); fab.className='fab'; fab.innerHTML='';
  if(ex.idx>0){
    const bp = el('button',{class:'btn-plain'},'← Zurück');
    bp.onclick=()=>{ ex.idx--; save(); renderExamQ(); };
    fab.appendChild(bp);
  }
  if(ex.idx < ex.count-1){
    const bn = el('button',{class:'btn-primary'},'Weiter →');
    bn.onclick=()=>{ ex.idx++; save(); renderExamQ(); };
    fab.appendChild(bn);
  } else {
    const bs = el('button',{class:'btn-green'},'✓ Abgeben');
    bs.onclick=()=>{
      if(ex.mc){
        const open = ex.qids.filter(q=>ex.answers[q]==null).length;
        const msg = open ? 'Noch '+open+' Fragen unbeantwortet (zählen als falsch). Trotzdem abgeben?' : 'Prüfung abgeben und auswerten?';
        if(confirm(msg)) finishExamMC();
      } else {
        if(confirm('Prüfung abgeben und zur Selbstbewertung?')) beginGrading();
      }
    };
    fab.appendChild(bs);
  }
}
function beginGrading(){
  clearTimer();
  const ex = state.activeExam;
  if(!ex) { renderHome(); return; }
  if(!ex.grades) ex.grades = {};
  save();
  renderExamReview();
}
function renderExamReview(){
  view='examReview'; clearTimer();
  const ex = state.activeExam;
  setHeader('Selbstbewertung', null, null);
  const main=$('#main'); main.innerHTML='';
  main.appendChild(el('p',{class:'hint',style:'text-align:left'},
    'Vergleiche deine Antwort mit der Musterantwort und bewerte ehrlich – daraus entsteht die Endauswertung.'));
  ex.qids.forEach((id,i)=>{
    const q = byId(id);
    const g = ex.grades[id];
    const c = el('div',{class:'card revitem '+(g===1?'g1':g===0.5?'gh':g===0?'g0':'')});
    const b = el('div',{class:'body'});
    b.appendChild(el('div',{class:'idtag'},'Frage '+(i+1)+' · Nr. '+q.id));
    b.appendChild(el('div',{class:'qt'},esc(q.q)));
    if(ex.notes[id]) b.appendChild(el('div',{class:'nt'},'<b>Deine Notizen:</b>\n'+esc(ex.notes[id])));
    b.appendChild(el('div',{class:'at'},esc(q.a)));
    const g3 = el('div',{class:'grade3'});
    const mk=(cls,txt,val)=>{ const bt=el('button',{class:cls+(g===val?' sel':'')},txt);
      bt.onclick=()=>{ ex.grades[id]=val; save();
        const y=window.scrollY; renderExamReview(); window.scrollTo(0,y); };
      return bt; };
    g3.appendChild(mk('g1','✓ Richtig',1));
    g3.appendChild(mk('gh','≈ Teilweise',0.5));
    g3.appendChild(mk('g0','✗ Falsch',0));
    b.appendChild(g3);
    c.appendChild(b);
    main.appendChild(c);
  });
  const open = ex.qids.filter(id=>!(id in ex.grades)).length;
  const fab=$('#fab'); fab.className='fab'; fab.innerHTML='';
  const bf = el('button',{class: open? 'btn-plain':'btn-green'}, open ? open+' Fragen noch unbewertet' : '✓ Auswertung anzeigen');
  bf.onclick=()=>{ if(open){ toast('Bitte erst alle Fragen bewerten.'); return; } finishExam(); };
  fab.appendChild(bf);
}
let lastMC = null;   // Detaildaten der letzten MC-Prüfung (nur für die Sitzung)
function finishExamMC(){
  clearTimer();
  const ex = state.activeExam;
  if(!ex){ renderHome(); return; }
  let p = 0; const wrong = [];
  for(const id of ex.qids){ if(ex.answers[id]===id) p++; else wrong.push(id); }
  const pct = Math.round(100*p/ex.count);
  const passed = pct >= state.settings.passPct;
  for(const id of wrong) applyGrade(id, 0);   // Fehler ins Lernsystem (Box 1)
  state.exams.push({datum:todayStr(), count:ex.count, p, pct, passed});
  lastMC = {qids:ex.qids, options:ex.options, answers:ex.answers};
  state.activeExam = null;
  save();
  renderExamResult({pct, passed, p, count:ex.count, wrong, partial:[]});
}
function renderExamMCDetail(){
  view='examMCDetail';
  setHeader('Prüfung im Detail', null, renderHome);
  const main=$('#main'); main.innerHTML='';
  lastMC.qids.forEach((id,i)=>{
    const q = byId(id);
    const right = lastMC.answers[id]===id;
    const c = el('div',{class:'card revitem '+(right?'g1':'g0')});
    const b = el('div',{class:'body'});
    b.appendChild(el('div',{class:'idtag'},'Frage '+(i+1)+' · Nr. '+q.id+' · '+(right?'✓ richtig':(lastMC.answers[id]==null?'– nicht beantwortet':'✗ falsch'))));
    b.appendChild(el('div',{class:'qt'},esc(q.q)));
    if(!right && lastMC.answers[id]!=null){
      b.appendChild(el('div',{class:'nt'},'<b>Deine Wahl:</b>\n'+esc(optText(lastMC.answers[id]))));
    }
    b.appendChild(el('div',{class:'at'},'<b>Richtige Antwort:</b>\n'+esc(q.a)));
    c.appendChild(b);
    main.appendChild(c);
  });
  const fab=$('#fab'); fab.className='fab'; fab.innerHTML='';
  const bh = el('button',{class:'btn-primary'},'Zur Übersicht');
  bh.onclick=renderHome;
  fab.appendChild(bh);
}
function finishExam(){
  const ex = state.activeExam;
  let p = 0;
  for(const id of ex.qids) p += ex.grades[id]||0;
  const pct = Math.round(100*p/ex.count);
  const passed = pct >= state.settings.passPct;
  /* Fehler ins Lernsystem übernehmen */
  for(const id of ex.qids){
    const g = ex.grades[id];
    if(g===0) applyGrade(id, 0);
    else if(g===0.5) applyGrade(id, 1);
  }
  const wrong = ex.qids.filter(id=>ex.grades[id]===0);
  const partial = ex.qids.filter(id=>ex.grades[id]===0.5);
  lastMC = null;
  state.exams.push({datum:todayStr(), count:ex.count, p, pct, passed});
  const result = {pct, passed, p, count:ex.count, wrong, partial};
  state.activeExam = null;
  save();
  renderExamResult(result);
}
function renderExamResult(res){
  view='examResult';
  setHeader('Ergebnis', null, null);
  const main=$('#main'); main.innerHTML='';
  const c = el('div',{class:'card'});
  const b = el('div',{class:'body resultbig'});
  b.appendChild(el('div',{class:'pct',style:'color:'+(res.passed?'var(--ok)':'var(--bad)')},res.pct+' %'));
  b.appendChild(el('div',{class:'verdict '+(res.passed?'ok':'bad')},res.passed?'🎉 Bestanden!':'Nicht bestanden'));
  b.appendChild(el('div',{class:'sub'},res.p+' von '+res.count+' Punkten · Bestehensgrenze '+state.settings.passPct+' %'));
  c.appendChild(b);
  main.appendChild(c);

  if(res.wrong.length || res.partial.length){
    const cf = el('div',{class:'card'});
    const bf = el('div',{class:'body'});
    bf.appendChild(el('h2',{},'Deine Fehler (jetzt in Box 1 zum Üben)'));
    for(const id of res.wrong){
      const q=byId(id);
      bf.appendChild(el('div',{style:'padding:8px 0;border-top:1px solid #eee;font-size:14px'},'<b style="color:var(--bad)">✗ '+q.id+'</b> – '+esc(q.q.split('\n')[0].slice(0,110))));
    }
    for(const id of res.partial){
      const q=byId(id);
      bf.appendChild(el('div',{style:'padding:8px 0;border-top:1px solid #eee;font-size:14px'},'<b style="color:var(--warn)">≈ '+q.id+'</b> – '+esc(q.q.split('\n')[0].slice(0,110))));
    }
    cf.appendChild(bf);
    main.appendChild(cf);
  } else {
    main.appendChild(el('p',{class:'hint'},'Fehlerfrei – stark! 💪'));
  }
  const fab=$('#fab'); fab.className='fab'; fab.innerHTML='';
  if(lastMC){
    const bd = el('button',{class:'btn-plain'},'Details');
    bd.onclick=renderExamMCDetail;
    fab.appendChild(bd);
  }
  const bh = el('button',{class:'btn-primary'},'Zur Übersicht');
  bh.onclick=renderHome;
  fab.appendChild(bh);
}

/* ================= Start ================= */
renderHome();
if(state.activeExam && !state.activeExam.grades && Date.now() < state.activeExam.deadline){
  /* laufende Prüfung nach App-Neustart anbieten */
  setTimeout(()=>{ if(confirm('Es läuft noch eine Prüfung. Jetzt fortsetzen?')) resumeExam(); }, 300);
}

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
